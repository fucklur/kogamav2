<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>KoGaMa v2 Games - Play, Create And Share Multiplayer Games!</title>

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
  <link rel="icon" type="image/jpeg" href="https://i.snipboard.io/9Q0tHv.jpg">

<body>

  <div class="bigrect">
